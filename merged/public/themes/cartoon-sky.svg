<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Cartoon theme sky: original drawing (sun, clouds). -->
  <g stroke="#3b2142" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- sun: flat disc, one lighter step, inked rim -->
    <circle cx="1268" cy="196" r="70" fill="#ffd03f"/>
    <path d="M1222 168a52 52 0 0 1 40-26" fill="none" stroke="#fff3b0" stroke-width="7"/>
    <!-- clouds: stroked shapes first, the same shapes filled on top, so only the outer contour is inked -->
    <g fill="#fffaf0">
      <circle cx="260" cy="170" r="44"/><circle cx="318" cy="150" r="58"/><circle cx="384" cy="176" r="40"/><rect x="226" y="176" width="190" height="40" rx="20"/>
      <circle cx="890" cy="118" r="30"/><circle cx="932" cy="102" r="42"/><circle cx="980" cy="122" r="30"/><rect x="866" y="122" width="140" height="30" rx="15"/>
    </g>
    <g fill="#fffaf0" stroke="none">
      <circle cx="260" cy="170" r="44"/><circle cx="318" cy="150" r="58"/><circle cx="384" cy="176" r="40"/><rect x="226" y="176" width="190" height="40" rx="20"/>
      <circle cx="890" cy="118" r="30"/><circle cx="932" cy="102" r="42"/><circle cx="980" cy="122" r="30"/><rect x="866" y="122" width="140" height="30" rx="15"/>
    </g>
    <path d="M250 206h150M880 144h100" fill="none" stroke="#f3dcc0" stroke-width="6"/>
  </g>
</svg>
